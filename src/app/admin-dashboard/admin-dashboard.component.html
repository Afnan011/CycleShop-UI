<div class="admin-layout">
  <header class="top-bar">
    <div class="header-left">
      <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo">
        <img src="../../assets/images/cycle_icon2.png" alt="EG Cycles" />
      </div>
      <h1>Dashboard</h1>
    </div>
    <div class="header-actions">
      <div class="search-bar">
        <input type="text" placeholder="Search..." aria-label="Search">
        <i class="fas fa-search"></i>
      </div>
      <div class="notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge">3</span>
      </div>
      <div class="user-profile" (click)="toggleUserMenu()">
        <div class="user-profile-text">
          <span class="user-name">{{username}}</span>
          <span class="user-role">Store Manager</span>
        </div>
        <img class="user-avatar" src="assets/images/user-avatar.svg" alt="User avatar" />
        <i class="fas fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <main class="main-content">
    <aside class="sidebar" [ngClass]="{'sidebar-collapsed': sidebarCollapsed}">
      <div class="sidebar-header">
        <div class="logo-small">
          <img src="../../assets/images/cycle_icon2.png" alt="EG Cycles" />
        </div>
        <span class="app-name">EG Cycles</span>
      </div>
      <nav class="nav-menu">
        <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <i class="fas fa-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/admin/dashboard/inventory" routerLinkActive="active" class="nav-item">
          <i class="fas fa-bicycle"></i>
          <span>Inventory</span>
          <span class="item-count">{{lowStockCount}}</span>
        </a>
        <a routerLink="/admin/dashboard/pos" routerLinkActive="active" class="nav-item">
          <i class="fa fa-cash-register"></i>
          <span>POS</span>
        </a>
        <a routerLink="/admin/dashboard/orders" routerLinkActive="active" class="nav-item">
          <i class="fas fa-shopping-cart"></i>
          <span>Orders</span>
          <span class="item-count">{{processingOrderCount}}</span>
        </a>
        <a routerLink="/admin/dashboard/customers" routerLinkActive="active" class="nav-item">
          <i class="fas fa-users"></i>
          <span>Customers</span>
        </a>
        <a routerLink="/admin/dashboard/employees" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-tie"></i>
          <span>Employees</span>
        </a>
        <a routerLink="/admin/dashboard/reports" routerLinkActive="active" class="nav-item">
          <i class="fas fa-chart-bar"></i>
          <span>Reports</span>
        </a>
        <a routerLink="/admin/dashboard/settings" routerLinkActive="active" class="nav-item">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
        <div class="logout-container">
          <a class="nav-item logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      </nav>
    </aside>
    
    <div class="dashboard-content">
      <div class="breadcrumb">
        <span>Admin</span>
        <i class="fas fa-chevron-right"></i>
        <span>Dashboard</span>
      </div>
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-confirm-modal
  [isOpen]="showLogoutModal"
  title="Confirm Logout"
  message="Are you sure you want to logout?"
  (onConfirm)="confirmLogout()"
  (onClose)="showLogoutModal = false">
</app-confirm-modal>

<!-- User dropdown menu -->
<div class="user-menu" *ngIf="showUserMenu">
  <div class="user-menu-header">
    <img class="user-avatar" src="assets/images/user-avatar.svg" alt="User avatar" />
    <div>
      <div class="user-name">{{username}}</div>
      <div class="user-email">{{userEmail}}</div>
    </div>
  </div>
  <div class="user-menu-items">
    <a class="user-menu-item" (click)="viewProfile()">
      <i class="fas fa-user"></i>
      <span>My Profile</span>
    </a>
    <a href="#" class="user-menu-item">
      <i class="fas fa-cog"></i>
      <span>Account Settings</span>
    </a>
    <hr>
    <a class="user-menu-item" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </a>
  </div>
</div>
