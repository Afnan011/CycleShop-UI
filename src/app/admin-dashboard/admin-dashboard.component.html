<div class="admin-layout">

  <header class="top-bar">
    <div class="header-left">
      <div class="logo">
        <img src="../../assets/images/cycle_icon2.png" alt="EG Cycles" />
      </div>
      <h1>Dashboard</h1>
    </div>
    <div class="user-profile">
      <div class="user-profile-text">
        <span class="user-name">{{username}}</span>
        <span class="user-role">Store Manager</span>
      </div>
      <img class="user-avatar" src="assets/images/user-avatar.svg" alt="User avatar" />
    </div>
  </header>
  <main class="main-content">
    <aside class="sidebar">
      <nav class="nav-menu">
        <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <i class="fas fa-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/admin/dashboard/inventory" routerLinkActive="active" class="nav-item">
          <i class="fas fa-bicycle"></i>
          <span>Inventory</span>
        </a>
        <a routerLink="/admin/dashboard/customers" routerLinkActive="active" class="nav-item">
          <i class="fas fa-users"></i>
          <span>Customers</span>
        </a>
        <a routerLink="/admin/dashboard/orders" routerLinkActive="active" class="nav-item">
          <i class="fas fa-shopping-cart"></i>
          <span>Orders</span>
        </a>
        <a routerLink="/admin/dashboard/employees" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-tie"></i>
          <span>Employees</span>
        </a>
        <a routerLink="/admin/dashboard/reports" routerLinkActive="active" class="nav-item">
          <i class="fas fa-chart-bar"></i>
          <span>Reports</span>
        </a>
        <a routerLink="/admin/dashboard/settings" routerLinkActive="active" class="nav-item">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
        <div class="logout-container">
          <a class="nav-item logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      </nav>
    </aside>
    <div class="dashboard-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
