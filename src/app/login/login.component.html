<div class="login-container">
  <div class="login-card">
    <div class="login-form">
      <div class="logo">
        <span class="bike-icon"><img src="assets/images/cycle_icon.png" alt="cycle_icon" width="40" height="40"></span>
        <h1>EG Cycles</h1>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Email / Username</label>
          <input
            type="text"
            id="email"
            name="email"
            [(ngModel)]="email"
            #emailInput="ngModel"
            class="form-control"
            required>
          <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-message">
            <small *ngIf="emailInput.errors?.['required']">Email / Username is required</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            #passwordInput="ngModel"
            class="form-control"
            required>
          <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error-message">
            <small *ngIf="passwordInput.errors?.['required']">Password is required</small>
          </div>
        </div>

        <button
          type="submit"
          class="sign-in-btn"
          [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>

        <div class="forgot-password">
          <a routerLink="/forgot-password">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>

  <div class="illustration">
    <img src="assets/images/cycle_svg.png" alt="Bicycle illustration" width="530" height="390">
  </div>
</div>
