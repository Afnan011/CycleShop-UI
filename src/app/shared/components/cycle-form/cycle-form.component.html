<div class="form-grid">
  <div class="form-group">
    <label>Model Name</label>
    <input
      type="text"
      [(ngModel)]="formData.modelName"
      class="form-control"
      placeholder="Enter model name"
      (blur)="markAsTouched('modelName')"
    />
    <span class="error-message" *ngIf="shouldShowError('modelName')">
      Model name is required
    </span>
  </div>
  <div class="form-group">
    <label>Brand</label>
    <select 
      [(ngModel)]="formData.brandName" 
      class="form-control"
      (change)="markAsTouched('brandName')"
      (blur)="markAsTouched('brandName')"
    >
      <option value="">Select Brand</option>
      <option *ngFor="let brand of brands" [value]="brand.name">
        {{ brand.name }}
      </option>
    </select>
    <span class="error-message" *ngIf="shouldShowError('brandName')">
      Brand is required
    </span>
  </div>
  <div class="form-group">
    <label>Type</label>
    <select 
      [(ngModel)]="formData.typeName" 
      class="form-control"
      (change)="markAsTouched('typeName')"
      (blur)="markAsTouched('typeName')"
    >
      <option value="">Select Type</option>
      <option *ngFor="let type of types" [value]="type.name">
        {{ type.name }}
      </option>
    </select>
    <span class="error-message" *ngIf="shouldShowError('typeName')">
      Type is required
    </span>
  </div>
  <div class="form-group">
    <label>Price</label>
    <input
      type="number"
      [(ngModel)]="formData.price"
      class="form-control"
      placeholder="Enter selling price"
      (blur)="markAsTouched('price')"
    />
    <span class="error-message" *ngIf="shouldShowError('price')">
      Price must be greater than 0
    </span>
  </div>
  <div class="form-group">
    <label>Cost Price</label>
    <input
      type="number"
      [(ngModel)]="formData.costPrice"
      class="form-control"
      placeholder="Enter cost price"
      (blur)="markAsTouched('costPrice')"
    />
    <span class="error-message" *ngIf="shouldShowError('costPrice')">
      Cost price must be greater than 0
    </span>
  </div>
  <div class="form-group">
    <label>Stock</label>
    <input
      type="number"
      [(ngModel)]="formData.stockQuantity"
      class="form-control"
      placeholder="Enter stock quantity"
      (blur)="markAsTouched('stockQuantity')"
    />
    <span class="error-message" *ngIf="shouldShowError('stockQuantity')">
      Stock cannot be negative
    </span>
  </div>
  <div class="form-group">
    <label>Reorder Threshold</label>
    <input
      type="number"
      [(ngModel)]="formData.reorderThreshold"
      class="form-control"
      placeholder="Enter reorder threshold"
      (blur)="markAsTouched('reorderThreshold')"
    />
    <span class="error-message" *ngIf="shouldShowError('reorderThreshold')">
      Reorder threshold must be greater than 0
    </span>
  </div>
  <div class="form-group">
    <label>Warehouse Location</label>
    <input
      type="text"
      [(ngModel)]="formData.warehouseLocation"
      class="form-control"
      placeholder="Enter warehouse location (e.g. A1-02)"
      (blur)="markAsTouched('warehouseLocation')"
    />
    <span class="error-message" *ngIf="shouldShowError('warehouseLocation')">
      Warehouse location is required
    </span>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea
      [(ngModel)]="formData.description"
      class="form-control"
      placeholder="Enter cycle description"
      (blur)="markAsTouched('description')"
    ></textarea>
    <span class="error-message" *ngIf="shouldShowError('description')">
      Description is required
    </span>
  </div>
  <div class="form-group" *ngIf="isEdit">
    <label>Status</label>
    <select [(ngModel)]="formData.isActive" class="form-control">
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>
  </div>
  <div class="form-group">
    <label>Image</label>
    <app-image-upload
      [previewUrl]="imageUrl"
      (uploadSuccess)="onImageUploadSuccess($event)"
      (uploadError)="imageError.emit($event)"
      (removeImage)="onImageRemove()"
    ></app-image-upload>
  </div>
</div>
<div class="form-actions">
  <button class="cancel-btn" (click)="cancel.emit()">Cancel</button>
  <button class="save-btn" (click)="onSubmit()" [disabled]="!validateForm()">
    {{ isEdit ? 'Save Changes' : 'Save Cycle' }}
  </button>
</div>
