<div class="forgot-password-container">
  <div class="logo">
    <span class="bike-icon"><img src="assets/images/cycle_icon.png" alt="cycle_icon" width="40" height="40"></span>
    <h1>EG Cycles</h1>
  </div>
  <div class="forgot-password-card">
    <div class="forgot-password-form">

      <h2>Forgot Password?</h2>
      <p class="description">Enter the email address you used and we'll send you instructions to reset your password</p>

      <!-- Success message -->
      <div *ngIf="successMessage" class="alert alert-success mb-3">
        {{ successMessage }}
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="alert alert-danger mb-3">
        {{ errorMessage }}
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            placeholder="Enter your email address">
          <div *ngIf="forgotPasswordForm.get('email')?.invalid && (forgotPasswordForm.get('email')?.dirty || forgotPasswordForm.get('email')?.touched)" class="error-message">
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</small>
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email address</small>
          </div>
        </div>

        <button
          type="submit"
          class="send-btn"
          [disabled]="forgotPasswordForm.invalid || isLoading" class="send-btn">
          <span *ngIf="!isLoading">Send recovery code</span>
          <span *ngIf="isLoading">Sending...</span>
        </button>

        <div class="back-to-login">
          <a (click)="backToLogin()" class="back-link">← Back to Sign in</a>
        </div>
      </form>
    </div>
  </div>
</div>
